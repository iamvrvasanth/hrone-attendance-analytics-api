
version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.11
    commands:
      - python --version
      - pip install --upgrade pip
      - pip install -r requirements.txt

  build:
    commands:
      - python -m compileall -q app
      - pytest -q

artifacts:
  files:
    - '**/*'
  exclude-paths:
    - '.git/**/*'
    - '.venv/**/*'
    - '.env'
    - '**/__pycache__/**/*'
    - '**/.pytest_cache/**/*'
